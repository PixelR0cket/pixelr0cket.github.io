<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Keith Merkelt Photography</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Karla:ital,wght@0,400;0,500;0,700;1,400&family=Cousine:wght@400;700&family=Permanent+Marker&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#ffffff;
    --ink:#222222;
    --graphite:#666666;
    --ash:#aaaaaa;
    --hairline:#e8e6e3;
    --safelight:#b0392a;
    /* One column of navigation on the left, one column of pictures beside it. */
    --side-x:60px;      /* sidebar from the left edge   */
    --side-w:196px;     /* sidebar width                */
    --col-x:336px;      /* where the picture column starts */
    --col-r:78px;       /* breathing room on the right  */
    --step:93px;        /* vertical gap, single column  */
    --split-gap:36px;   /* gap between and below frames, two columns */
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--paper);}
  body{
    color:var(--ink);
    font-family:'Karla',system-ui,sans-serif;
    font-size:14px; line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{background:#f0ecea;}

  /* ---------------- masthead ---------------- */
  .masthead{
    position:fixed; top:72px; left:var(--side-x); width:var(--side-w); z-index:40;
    display:flex; flex-direction:column;
  }
  .masthead-top{ display:contents; }
  .brand{
    order:1;
    /* Hand-lettered, and the only thing on the page not set in type: the
       wordmark signs the pictures, the rest of the sidebar merely labels them. */
    font-family:'Permanent Marker',ui-rounded,cursive; font-weight:400;
    font-size:29px; line-height:1.14; text-transform:uppercase;
    /* The face has one weight only, so the strokes are thinned by painting a
       hairline of paper back over them — which needs paper behind the letters. */
    -webkit-text-stroke:0.55px var(--paper);
    outline:none;
    border-bottom:1px dashed transparent; padding-bottom:2px;
  }
  .brand[contenteditable]{cursor:text;}
  .brand[contenteditable]:hover{border-bottom-color:var(--hairline);}
  .brand:focus{border-bottom-color:var(--safelight);}
  .frame-tally{ order:3; margin-top:16px; color:var(--ash); }
  .masthead.no-tabs .frame-tally{ margin-top:26px; }

  /* ---------------- collection tabs ---------------- */
  .tabs{ order:2; display:block; margin-top:84px; }
  .tab{
    appearance:none; background:none; border:none;
    display:block; width:100%; text-align:left;
    /* Monospaced: the wide, evenly-spaced look is the advance width itself,
       so this wants no added letter-spacing. */
    font-family:'Cousine',ui-monospace,monospace; font-weight:400;
    font-size:15px; color:var(--ink); cursor:pointer;
    padding:0; margin:0 0 14px 0;
    line-height:1.35;
    transition:color .15s ease;
  }
  .tab:hover{color:var(--ash);}
  /* The collection you are already looking at is the one you cannot click. */
  .tab[aria-selected="true"]{ color:var(--safelight); cursor:default; }
  .tab-count{ color:var(--ash); margin-left:7px; }
  body.published .tab-count{ display:none; }
  .tab-new{ color:var(--ash); margin-top:2px; }
  .tab-new:hover{ color:var(--ink); }

  /* ---------------- empty state ---------------- */
  .empty{
    margin-left:var(--col-x); margin-right:var(--col-r); max-width:541px;
    padding:80px 0 40px;
  }
  .empty h1{
    font-size:22px; font-weight:700; line-height:1.2;
    margin:0 0 12px; letter-spacing:normal;
  }
  .empty p{ color:var(--ink); margin:0 0 22px; }
  .btn{
    font:inherit; color:var(--ink); background:none; border:none; padding:0;
    cursor:pointer; text-decoration:underline; text-underline-offset:3px;
    transition:color .15s ease;
  }
  .btn:hover{ color:var(--ash); }
  input[type=file]{display:none;}

  /* ---------------- a page of words ---------------- */
  /* Contact hangs in the same column the pictures use, so switching to it
     moves nothing but the content. */
  .page{
    margin-left:var(--col-x); margin-right:var(--col-r); max-width:541px;
    padding:72px 0 40px;
  }
  .page[hidden]{ display:none; }
  .page-title{ font-size:22px; font-weight:700; line-height:1.2; margin:0 0 26px; }
  .page-body{ margin:0; }
  .page-link{
    color:var(--ink); text-decoration:underline; text-underline-offset:3px;
    transition:color .15s ease;
  }
  .page-link:hover{ color:var(--ash); }

  /* ---------------- the roll ---------------- */
  /* The cap is only there to stop a very wide monitor blowing the pictures up
     past the resolution they are served at; short of that the column fills. */
  .roll{ margin-left:var(--col-x); margin-right:var(--col-r); max-width:1440px; padding:72px 0 40px; }
  /* .roll-split sets display:flex, which would out-shout the hidden attribute. */
  .roll[hidden]{ display:none; }

  .frame{ margin-bottom:var(--step); display:flex; flex-direction:column; }
  .frame:last-child{ margin-bottom:0; }

  /* Two columns of pictures, each frame going to whichever column is shorter. */
  .roll-split{ display:flex; align-items:flex-start; gap:var(--split-gap); }
  .roll-col{ flex:1 1 0; min-width:0; }
  .roll-split .frame{ margin-bottom:var(--split-gap); }
  .frame > .plate{ order:1; }
  .frame > .caption{ order:2; }
  .frame > .mark{ order:3; }

  .plate{
    position:relative;
    background:#f7f6f4;
    line-height:0;
    user-select:none; -webkit-user-select:none;
    -webkit-touch-callout:none;
  }
  .plate img{
    display:block; width:100%; height:auto;
    opacity:0; transition:opacity .7s ease;
    pointer-events:none;
  }
  .plate img.shown{ opacity:1; }
  /* transparent shield: intercepts right-click and long-press over the image */
  .shield{ position:absolute; inset:0; }

  /* ---------------- camera mark ---------------- */
  .mark{
    display:flex; align-items:flex-start; justify-content:space-between;
    gap:28px;
    margin-top:2px; padding:0;
  }
  .mark-exposure{ min-width:0; }
  .mark-line-1{ color:var(--ash); }
  .mark-line-2{ color:var(--ash); }
  .mark-body{ display:flex; align-items:center; gap:18px; flex-shrink:0; }
  .mark-make{ color:var(--ash); white-space:nowrap; }
  /* Maker logos ship as solid black artwork. Now that every other piece of
     metadata is grey, an untouched logo outweighs the photograph's own title. */
  .mark-logo{ height:13px; width:auto; flex-shrink:0; display:block; opacity:0.34; }
  .mark-rule{ width:1px; align-self:stretch; background:#ececec; }
  .mark-gear{ text-align:left; min-width:0; }
  .mark-model{ color:var(--ash); }
  .mark-lens{ color:var(--ash); }

  /* ---------------- caption ---------------- */
  .caption{
    margin-top:14px;
    display:flex; align-items:baseline; justify-content:space-between; gap:20px;
  }
  .caption-title{
    font:inherit; font-style:italic; color:var(--ink);
    outline:none; min-width:100px;
    border-bottom:1px dashed transparent; padding-bottom:2px;
  }
  .caption-title[contenteditable]{cursor:text;}
  .caption-title[contenteditable]:hover{ border-bottom-color:var(--hairline); }
  .caption-title:focus{ border-bottom-color:var(--safelight); }
  .caption-title:empty:before{
    content:'Untitled'; color:var(--ash); font-style:italic;
  }
  .frame-actions{
    display:flex; gap:14px; flex-shrink:0;
    opacity:0; transition:opacity .15s ease;
  }
  .frame:hover .frame-actions, .frame:focus-within .frame-actions{ opacity:1; }
  .link-action{
    appearance:none; background:none; border:none; padding:0; cursor:pointer;
    font:inherit; color:var(--ash);
    text-decoration:underline; text-underline-offset:3px;
  }
  .link-action:hover{ color:var(--ink); }

  /* ---------------- add button ---------------- */
  .fab{
    position:fixed; left:var(--side-x); bottom:112px; z-index:40;
    display:none; width:var(--side-w); text-align:left;
    font:inherit; color:var(--ink); background:none; border:none; padding:0;
    cursor:pointer; text-decoration:underline; text-underline-offset:3px;
    transition:color .15s ease;
  }
  .fab:hover{ color:var(--ash); }

  /* ---------------- copyright ---------------- */
  /* Foot of the sidebar rather than foot of the roll: the roll has no foot
     until you have scrolled the whole of it. */
  .site-copy{
    position:fixed; left:var(--side-x); bottom:56px; z-index:40;
    width:var(--side-w); color:var(--ink); font-size:13px; line-height:1.5;
  }

  .sentinel{ height:1px; }
  footer{
    margin-left:var(--col-x); color:var(--ash);
    padding:26px 0 80px; display:none;
  }


  /* ---------------- viewer ---------------- */
  /* Published, the roll is pictures only: a photograph's title and the
     camera that took it wait until you open it. */
  body.published .frame > .caption,
  body.published .frame > .mark{ display:none; }
  body.published .roll .plate{ cursor:zoom-in; }
  body.viewing{ overflow:hidden; }

  .viewer{
    position:fixed; inset:0; z-index:100;
    /* Solid, not a veil: at 97% the roll behind still ghosted through,
       which read as clutter around the photograph. */
    background:var(--paper);
    display:flex; align-items:center; justify-content:center;
    padding:52px 68px;
  }
  .viewer[hidden]{ display:none; }
  .viewer-stage{
    display:flex; flex-direction:column; align-items:flex-start;
    max-width:100%; max-height:100%;
  }
  /* .plate carries the right-click and drag deterrence, so the viewer keeps it. */
  .viewer-plate{ background:none; max-width:100%; }
  .viewer-plate img{
    width:auto; height:auto;
    max-width:100%; max-height:72vh;
  }
  .viewer-caption{ margin-top:14px; width:100%; }
  .viewer-title{ font-style:italic; color:var(--ink); }
  .viewer-caption .mark{ margin-top:2px; }

  .viewer-close,.viewer-step{
    position:absolute; z-index:1;
    font:inherit; line-height:1; color:var(--ash);
    background:none; border:none; cursor:pointer;
    transition:color .15s ease;
  }
  .viewer-close:hover,.viewer-step:hover{ color:var(--ink); }
  /* Opening the viewer moves focus to the close button so Escape and Tab have
     somewhere to start; the ring should only show if you got there by keyboard. */
  .viewer:focus{ outline:none; }
  .viewer-close:focus,.viewer-step:focus{ outline:none; }
  .viewer-close:focus-visible,.viewer-step:focus-visible{
    outline:1px solid var(--ash); outline-offset:3px;
  }
  .viewer-close{ top:20px; right:24px; font-size:24px; padding:6px 8px; }
  .viewer-step{ top:50%; transform:translateY(-50%); font-size:30px; padding:12px 16px; }
  .viewer-step[hidden]{ display:none; }
  .viewer-prev{ left:14px; }
  .viewer-next{ right:14px; }

  /* Narrower desktops: pull both columns in before anything has to move. */
  @media (max-width:1100px){
    :root{ --side-x:40px; --col-x:276px; --col-r:40px; --step:76px; }
  }

  /* No room for two columns: the sidebar becomes a header and the pictures run full width. */
  @media (max-width:780px){
    :root{ --side-x:0px; --col-x:0px; --col-r:0px; --step:14px; }
    body{ padding:0 5vw; }
    .masthead{
      position:static; width:auto;
      padding:34px 0 0; margin-bottom:4px;
    }
    .tabs{
      display:flex; margin-top:18px;
      overflow-x:auto; scrollbar-width:none;
    }
    .tabs::-webkit-scrollbar{ display:none; }
    .tab{ display:inline-block; width:auto; white-space:nowrap; margin:0 20px 0 0; }
    .tab-new{ margin-top:0; }
    .frame-tally{ margin-top:14px; }
    .masthead.no-tabs .frame-tally{ margin-top:14px; }
    .empty{ max-width:none; padding-top:44px; }
    .page{ max-width:none; padding-top:34px; }
    .roll{ padding-top:34px; }
    /* Centring the picture left it stranded ~190px below the control row.
       On a phone it hangs from the top instead, just under the controls. */
    .viewer{ align-items:flex-start; padding:70px 5vw 24px; }
    .viewer-plate img{ max-height:58vh; }
    .viewer-close,.viewer-step{
      top:12px; bottom:auto; transform:none;
      font-size:22px; padding:10px 13px;
    }
    .viewer-close{ right:5vw; }
    .viewer-step{ left:auto; }
    .viewer-next{ right:calc(5vw + 46px); }
    .viewer-prev{ right:calc(5vw + 92px); }
    .fab{
      position:static; width:auto; display:none;
      margin:22px 0 0;
    }
    .site-copy{ position:static; width:auto; margin:8px 0 0; padding-bottom:44px; }
    .frame-actions{ opacity:1; }

    /* Stack the camera mark rather than letting it crush the exposure line. */
    .frame > .mark,
    .viewer-caption .mark{ flex-direction:column; gap:6px; }
    .mark-body{ gap:12px; }
    .mark-logo{ height:11px; }
  }
  @media (prefers-reduced-motion:reduce){
    *{ transition:none !important; }
  }
</style>
</head>
<body>

<div class="masthead">
  <div class="masthead-top">
    <div class="brand" contenteditable="true" spellcheck="false">Keith Merkelt Photography</div>
    <div class="frame-tally" id="tally">0 frames</div>
  </div>
  <div class="tabs" id="tabs" role="tablist"></div>
</div>

<div class="empty" id="empty">
  <h1>An empty roll.</h1>
  <p>Load in your photographs. Titles come from the filename &mdash; click any title to rewrite it. Exposure and camera data are read from the file itself.</p>
  <button class="btn" id="emptyAdd">Add photographs</button>
</div>

<main class="roll" id="roll"></main>
<section class="page" id="contact" hidden></section>
<div class="sentinel" id="sentinel"></div>
<footer id="footer">End of roll</footer>

<div class="site-copy">
  Copyright <span id="copyName">Keith Merkelt</span> <span id="copyYear">2026</span> &copy;<br>
  All rights reserved.
</div>

<div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-label="Photograph" tabindex="-1" hidden>
  <button class="viewer-close" id="viewerClose" aria-label="Close">&times;</button>
  <button class="viewer-step viewer-prev" id="viewerPrev" aria-label="Previous photograph">&#8249;</button>
  <button class="viewer-step viewer-next" id="viewerNext" aria-label="Next photograph">&#8250;</button>
  <div class="viewer-stage">
    <div class="plate viewer-plate">
      <img id="viewerImg" alt="" draggable="false">
      <div class="shield"></div>
    </div>
    <div class="viewer-caption">
      <div class="viewer-title" id="viewerTitle"></div>
      <div id="viewerMark"></div>
    </div>
  </div>
</div>

<button class="fab" id="fab">+&nbsp;&nbsp;Add to <span id="fabTarget">All</span></button>
<input type="file" id="fileInput" accept="image/*" multiple>

<script>
(function(){
  'use strict';

  const BATCH = 8;
  const LOOKAHEAD = 900;          // px of runway kept painted below the fold
  const EXIFR = 'https://cdnjs.cloudflare.com/ajax/libs/exifr/7.1.3/full.umd.min.js';

  const els = {
    roll: document.getElementById('roll'),
    tabs: document.getElementById('tabs'),
    empty: document.getElementById('empty'),
    tally: document.getElementById('tally'),
    footer: document.getElementById('footer'),
    fab: document.getElementById('fab'),
    fabTarget: document.getElementById('fabTarget'),
    sentinel: document.getElementById('sentinel'),
    masthead: document.querySelector('.masthead'),
    contact: document.getElementById('contact'),
    fileInput: document.getElementById('fileInput'),
    brand: document.querySelector('.brand')
  };

  /* Two views stand outside the collections: MAIN is the front page — the
     photographs hung loose, with no collection behind them — and 'All' is
     everything the site holds, collections included. */
  let MAIN = 'Featured Work';
  /* A view that holds no photographs at all. */
  const CONTACT = 'Contact';

  let photos = [];
  let collections = [];
  let active = MAIN;
  let rendered = 0;
  let published = false;
  let contact = null;

  /* ---------- formatting ---------- */

  const CAMERA_DEFAULT = /^(dsc|img|dscf|dscn|mg|imgp|gopr|pxl|photo|p)\d+$/i;

  /* Brand marks, keyed on the tidied EXIF Make. Anything not listed here keeps
     the plain wordmark, so an unknown camera still identifies itself. */
  const LOGOS = {
    sony: 'logos/sony.png',
    canon: 'logos/canon.png'
  };

  function titleFromFilename(name){
    let base = name.replace(/\.[^/.]+$/, '').replace(/^_+/,'');
    const squashed = base.replace(/[\s_-]+/g,'');
    if (CAMERA_DEFAULT.test(squashed)) return '';
    if (/^[0-9a-f]{8,}$/i.test(squashed)) return '';
    return base.replace(/^\d{1,3}[-_. ]+(?=\D)/,'')   // '01-' orders it, silently
               .replace(/[_-]+/g,' ').trim().replace(/\s+/g,' ')
               .replace(/\S+/g, w => w[0].toUpperCase() + w.slice(1));
  }

  function shutter(v){
    if (v == null || !(v > 0)) return null;
    if (v >= 1) return (Math.round(v*10)/10) + 's';
    return '1/' + Math.round(1/v) + 's';
  }

  function shotDate(raw){
    if (!raw) return null;
    /* A day with no clock time was typed by hand: show just the day. Parse it
       as local too — new Date('2026-04-11') is UTC midnight, which reads as the
       previous evening anywhere west of Greenwich. */
    const dayOnly = typeof raw === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(raw);
    const d = raw instanceof Date ? raw
            : dayOnly ? new Date(+raw.slice(0,4), +raw.slice(5,7) - 1, +raw.slice(8,10))
            : new Date(raw);
    if (isNaN(d.getTime())) return null;
    const mon = d.toLocaleString('en-GB',{month:'short'});
    const day = d.getDate() + ' ' + mon + ' ' + d.getFullYear();
    if (dayOnly) return day;
    const time = d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
    return day + ' at ' + time;
  }

  function tidyMake(make){
    if (!make) return null;
    return make.replace(/corporation|corp\.?|co\.,?\s*ltd\.?|imaging/gi,'').trim().split(/\s+/)[0];
  }

  function tidyModel(model, make){
    if (!model) return null;
    const m = tidyMake(make);
    if (m && model.toUpperCase().indexOf(m.toUpperCase()) === 0){
      return model.slice(m.length).trim() || model;
    }
    return model;
  }

  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"]/g,
      c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  }

  /* ---------- rendering ---------- */

  function visible(){
    if (active === 'All') return photos;
    if (active === CONTACT) return [];
    if (active === MAIN) return photos.filter(p => !p.collection);
    return photos.filter(p => p.collection === active);
  }

  function buildMark(x){
    const exposure = [
      x.iso != null ? 'ISO' + x.iso : null,
      x.aperture != null ? '\u0192/' + x.aperture : null,
      shutter(x.shutter)
    ].filter(Boolean).join(' ');

    const make = tidyMake(x.make);
    const model = tidyModel(x.model, x.make);
    const focal = x.focal ? Math.round(x.focal) + 'mm' : null;
    const lens = x.lens || focal;
    const date = shotDate(x.date);

    if (!exposure && !make && !model && !lens && !date) return '';

    const left = (exposure || date)
      ? '<div class="mark-exposure">' +
          (exposure ? '<div class="mark-line-1">' + esc(exposure) + '</div>' : '') +
          (date ? '<div class="mark-line-2">' + esc(date) + '</div>' : '') +
        '</div>'
      : '<div></div>';

    const logo = make ? LOGOS[make.toLowerCase()] : null;

    const right = (make || model || lens)
      ? '<div class="mark-body">' +
          (make
            ? (logo
                ? '<img class="mark-logo" src="' + logo + '" alt="' + esc(make) + '">'
                : '<div class="mark-make">' + esc(make) + '</div>')
            : '') +
          (make && (model || lens) ? '<div class="mark-rule"></div>' : '') +
          '<div class="mark-gear">' +
            (model ? '<div class="mark-model">' + esc(model) + '</div>' : '') +
            (lens ? '<div class="mark-lens">' + esc(lens) + '</div>' : '') +
          '</div>' +
        '</div>'
      : '';

    return '<div class="mark">' + left + right + '</div>';
  }

  function buildFrame(p){
    const frame = document.createElement('article');
    frame.className = 'frame';

    const ratio = (p.w && p.h) ? 'aspect-ratio:' + p.w + '/' + p.h + ';' : '';
    /* The frame is filled with the photograph's own average colour, so a picture
       resolves out of its own tone instead of appearing against grey. */
    const tone = /^#[0-9a-f]{6}$/i.test(p.tone || '') ? 'background:' + p.tone + ';' : '';
    const others = collections.filter(c => c !== p.collection);
    const editable = published ? '' : ' contenteditable="true"';

    frame.innerHTML =
      '<div class="plate" style="' + ratio + tone + '">' +
        '<img alt="' + esc(p.title) + '" draggable="false" loading="lazy" decoding="async">' +
        '<div class="shield"></div>' +
      '</div>' +
      buildMark(p) +
      '<div class="caption">' +
        '<div class="caption-title"' + editable + ' spellcheck="false">' + esc(p.title) + '</div>' +
        (published ? '' :
          '<div class="frame-actions">' +
            (others.length ? '<button class="link-action" data-act="move">Move</button>' : '') +
            '<button class="link-action" data-act="remove">Remove</button>' +
          '</div>') +
      '</div>';

    const img = frame.querySelector('img');
    img.addEventListener('load', function(){
      img.classList.add('shown');
      if (!p.w){
        p.w = img.naturalWidth; p.h = img.naturalHeight;
        frame.querySelector('.plate').style.aspectRatio = p.w + '/' + p.h;
      }
    });
    img.addEventListener('error', function(){
      /* The manifest points at a file that is not there — a photograph removed
         without a rebuild. Drop the frame rather than hold open a grey hole. */
      const i = photos.indexOf(p);
      if (i !== -1) photos.splice(i, 1);
      frame.remove();
      if (rendered > 0) rendered--;
      if (!photos.length){ repaint(); return; }
      paintTabs();
      retally();
      fillViewport();
    });
    img.src = p.src;

    const title = frame.querySelector('.caption-title');
    if (!published){
      title.addEventListener('blur', function(){
        p.title = title.textContent.trim();
        img.alt = p.title;
      });
      title.addEventListener('keydown', function(e){
        if (e.key === 'Enter'){ e.preventDefault(); title.blur(); }
      });
    }

    const plate = frame.querySelector('.plate');
    plate.addEventListener('click', function(){ showViewer(p); });
    if (published){
      plate.tabIndex = 0;
      plate.setAttribute('role', 'button');
      plate.setAttribute('aria-label', 'Open ' + (p.title || 'photograph'));
      plate.addEventListener('keydown', function(e){
        if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); showViewer(p); }
      });
    }

    frame.addEventListener('click', function(e){
      const act = e.target.dataset && e.target.dataset.act;
      if (act === 'remove'){
        photos = photos.filter(function(q){ return q !== p; });
        repaint();
      } else if (act === 'move'){
        const choice = prompt('Move to which collection?\n\n' + others.join('\n'), others[0]);
        if (choice && collections.indexOf(choice.trim()) !== -1){
          p.collection = choice.trim();
          repaint();
        }
      }
    });

    return frame;
  }

  function retally(){
    const n = visible().length;
    els.tally.textContent = (n === 1 ? '1 frame' : n + ' frames');
    els.footer.style.display = (rendered > 0 && rendered >= n) ? 'block' : 'none';
  }

  /* Wide enough for two columns of pictures beside the sidebar. */
  const SPLIT = window.matchMedia('(min-width:900px)');

  function resetRoll(){
    els.roll.innerHTML = '';
    if (SPLIT.matches){
      els.roll.classList.add('roll-split');
      els.roll.innerHTML = '<div class="roll-col"></div><div class="roll-col"></div>';
    } else {
      els.roll.classList.remove('roll-split');
    }
  }

  /* Frames arrive one at a time and are never re-flowed, so each one goes to
     whichever column is currently shorter. Heights are known before the
     photographs load, because the manifest carries their dimensions. */
  function nextColumn(){
    if (!els.roll.classList.contains('roll-split')) return els.roll;
    const cols = els.roll.children;
    return cols[0].offsetHeight <= cols[1].offsetHeight ? cols[0] : cols[1];
  }

  function paintBatch(){
    const slice = visible().slice(rendered, rendered + BATCH);
    slice.forEach(function(p){ nextColumn().appendChild(buildFrame(p)); });
    rendered += slice.length;
    retally();
  }

  /* The observer only fires when the sentinel *crosses* into range. Repainting
     a shorter roll can leave it already in range and silently stuck, so top the
     roll up until the sentinel is back below the runway. */
  function fillViewport(){
    let guard = 0;
    while (rendered < visible().length && guard++ < 40){
      if (els.sentinel.getBoundingClientRect().top > window.innerHeight + LOOKAHEAD) break;
      paintBatch();
    }
  }

  function repaint(){
    /* Contact swaps the pictures out rather than scrolling past them: no roll,
       no tally, no invitation to add photographs to a page of words. */
    const onContact = !!contact && active === CONTACT;
    els.contact.hidden = !onContact;
    els.roll.hidden = onContact;
    els.tally.hidden = onContact;
    resetRoll();
    rendered = 0;
    paintTabs();
    const any = photos.length > 0;
    els.empty.style.display = (any || onContact) ? 'none' : 'block';
    if (!published) els.fab.style.display = (any && !onContact) ? 'block' : 'none';
    els.fabTarget.textContent = active;
    retally();
    if (onContact) return;
    paintBatch();
    fillViewport();
  }

  function paintContact(){
    if (!contact) return;
    els.contact.innerHTML =
      '<h1 class="page-title">' + esc(contact.heading || CONTACT) + '</h1>' +
      '<p class="page-body">' +
        '<a class="page-link" href="mailto:' + esc(contact.email) + '">' +
          esc(contact.email) +
        '</a>' +
      '</p>';
  }

  function paintTabs(){
    /* No collections on a published site means no picture views worth listing:
       just the main scroll, and whatever pages stand beside it. */
    const list = (published && !collections.length) ? [] : [MAIN, 'All'].concat(collections);
    let html = list.map(function(c){
      const n = c === 'All' ? photos.length
              : c === MAIN ? photos.filter(function(p){ return !p.collection; }).length
              : photos.filter(function(p){ return p.collection === c; }).length;
      return '<button class="tab" role="tab" aria-selected="' + (c === active) + '" data-col="' + esc(c) + '">' +
             esc(c) + '<span class="tab-count">' + n + '</span></button>';
    }).join('');
    if (contact){
      html += '<button class="tab" role="tab" aria-selected="' + (active === CONTACT) +
              '" data-col="' + CONTACT + '">' + CONTACT + '</button>';
    }
    if (!published) html += '<button class="tab tab-new" id="newCol" title="New collection" aria-label="New collection">+ New collection</button>';
    els.tabs.style.display = html ? '' : 'none';
    els.masthead.classList.toggle('no-tabs', !html);
    els.tabs.innerHTML = html;

    els.tabs.querySelectorAll('.tab[data-col]').forEach(function(btn){
      btn.addEventListener('click', function(){
        if (active === btn.dataset.col) return;
        active = btn.dataset.col;
        window.scrollTo(0, 0);
        repaint();
      });
    });
    const nc = document.getElementById('newCol');
    if (nc) nc.addEventListener('click', function(){
      const name = prompt('Name this collection');
      if (name && name.trim() && collections.indexOf(name.trim()) === -1){
        collections.push(name.trim());
        active = name.trim();
        repaint();
      }
    });
  }

  /* ---------- local ingest ---------- */

  /* Drafting only, so it is fetched on first use rather than shipped to every
     visitor of the published site. Resolves to null if the CDN is unreachable:
     filenames still become captions, the exposure line is simply left off. */
  let exifrReady = null;
  function loadExifr(){
    if (!exifrReady){
      exifrReady = new Promise(function(resolve){
        const tag = document.createElement('script');
        tag.src = EXIFR;
        tag.onload = function(){ resolve(window.exifr || null); };
        tag.onerror = function(){ resolve(null); };
        document.head.appendChild(tag);
      });
    }
    return exifrReady;
  }

  async function ingest(fileList){
    if (published) return;
    const files = Array.prototype.slice.call(fileList)
      .filter(function(f){ return f.type.indexOf('image/') === 0; });
    if (!files.length) return;
    const target = (active === 'All' || active === MAIN) ? null : active;
    const reader = await loadExifr();

    for (const file of files){
      const p = {
        src: URL.createObjectURL(file),
        title: titleFromFilename(file.name),
        collection: target
      };
      if (reader){
        try {
          const x = await reader.parse(file, { pick:[
            'Make','Model','LensModel','FocalLength','FNumber','ExposureTime',
            'ISO','DateTimeOriginal','CreateDate','ExifImageWidth','ExifImageHeight'
          ]});
          if (x){
            p.make = x.Make; p.model = x.Model; p.lens = x.LensModel;
            p.focal = x.FocalLength; p.aperture = x.FNumber;
            p.shutter = x.ExposureTime; p.iso = x.ISO;
            p.date = x.DateTimeOriginal || x.CreateDate;
            p.w = x.ExifImageWidth; p.h = x.ExifImageHeight;
          }
        } catch(err){ /* no EXIF — the caption still works */ }
      }
      photos.push(p);
    }
    repaint();
  }

  /* ---------- manifest mode (the deployed site) ---------- */

  async function loadManifest(){
    try {
      const res = await fetch('photos.json', {cache:'no-cache'});
      if (!res.ok) return false;
      const data = await res.json();
      if (!data.photos || !data.photos.length) return false;
      published = true;
      document.body.classList.add('published');
      if (data.title){
        els.brand.textContent = data.title;
        document.title = data.title;
      }
      /* build.py names the front page after the folder it comes from, so the
         tab and the folder on disk cannot drift apart. */
      if (data.front){ MAIN = data.front; active = MAIN; }
      if (data.contact && data.contact.email){ contact = data.contact; paintContact(); }
      els.brand.removeAttribute('contenteditable');
      stampCopyright();
      collections = data.collections || [];
      photos = data.photos;
      els.fab.remove();
      repaint();
      return true;
    } catch(err){ return false; }
  }

  /* ---------- copyright ---------- */

  /* Signed by the photographer, so the wordmark's trailing 'Photography'
     comes off, and the year is whatever year it is being read in. */
  function stampCopyright(){
    const name = (els.brand.textContent || '').replace(/\s*photography\s*$/i,'').trim();
    if (name) document.getElementById('copyName').textContent = name;
    document.getElementById('copyYear').textContent = new Date().getFullYear();
  }

  /* ---------- wiring ---------- */

  els.fileInput.addEventListener('change', function(e){
    ingest(e.target.files); els.fileInput.value = '';
  });
  els.fab.addEventListener('click', function(){ els.fileInput.click(); });
  document.getElementById('emptyAdd').addEventListener('click', function(){ els.fileInput.click(); });

  document.body.addEventListener('dragover', function(e){ if (!published) e.preventDefault(); });
  document.body.addEventListener('drop', function(e){
    if (published) return;
    e.preventDefault();
    if (e.dataTransfer && e.dataTransfer.files.length) ingest(e.dataTransfer.files);
  });

  // Deterrence only — friction, not protection.
  document.addEventListener('contextmenu', function(e){
    if (e.target.closest && e.target.closest('.plate')) e.preventDefault();
  });
  document.addEventListener('dragstart', function(e){
    if (e.target.closest && e.target.closest('.plate')) e.preventDefault();
  });


  /* ---------- viewer ---------- */

  const viewer = {
    root:  document.getElementById('viewer'),
    img:   document.getElementById('viewerImg'),
    title: document.getElementById('viewerTitle'),
    mark:  document.getElementById('viewerMark'),
    close: document.getElementById('viewerClose'),
    prev:  document.getElementById('viewerPrev'),
    next:  document.getElementById('viewerNext'),
    list:  [],
    i:     -1
  };

  function paintViewer(){
    const p = viewer.list[viewer.i];
    if (!p) return;
    viewer.img.classList.remove('shown');
    viewer.img.alt = p.title || '';
    viewer.img.src = p.src;
    viewer.title.textContent = p.title || '';
    viewer.mark.innerHTML = buildMark(p);
    /* Stepping is only offered when there is somewhere to step to. */
    const many = viewer.list.length > 1;
    viewer.prev.hidden = !many;
    viewer.next.hidden = !many;
  }

  function showViewer(p){
    /* Snapshot the collection on open: the roll only holds the frames painted
       so far, but every photograph in the collection can be stepped through. */
    viewer.list = visible();
    viewer.i = viewer.list.indexOf(p);
    if (viewer.i === -1) return;
    paintViewer();
    viewer.root.hidden = false;
    document.body.classList.add('viewing');
    viewer.root.focus();
  }

  function stepViewer(d){
    if (viewer.list.length < 2) return;
    viewer.i = (viewer.i + d + viewer.list.length) % viewer.list.length;
    paintViewer();
  }

  function hideViewer(){
    viewer.root.hidden = true;
    document.body.classList.remove('viewing');
    viewer.img.removeAttribute('src');
    viewer.list = [];
    viewer.i = -1;
  }

  viewer.img.addEventListener('load', function(){ viewer.img.classList.add('shown'); });
  viewer.close.addEventListener('click', hideViewer);
  viewer.prev.addEventListener('click', function(){ stepViewer(-1); });
  viewer.next.addEventListener('click', function(){ stepViewer(1); });
  /* Anywhere off the photograph and its caption closes it. */
  viewer.root.addEventListener('click', function(e){
    if (!e.target.closest('.viewer-stage, .viewer-close, .viewer-step')) hideViewer();
  });
  document.addEventListener('keydown', function(e){
    if (viewer.root.hidden) return;
    if (e.key === 'Escape'){ hideViewer(); }
    else if (e.key === 'ArrowLeft'){ stepViewer(-1); }
    else if (e.key === 'ArrowRight'){ stepViewer(1); }
  });

  SPLIT.addEventListener('change', function(){ if (photos.length) repaint(); });

  new IntersectionObserver(function(entries){
    if (entries[0].isIntersecting) fillViewport();
  }, {rootMargin: LOOKAHEAD + 'px'}).observe(els.sentinel);

  stampCopyright();
  loadManifest().then(function(ok){ if (!ok) repaint(); });
})();
</script>
</body>
</html>
